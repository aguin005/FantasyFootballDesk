<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A pane of glass holding three roster rows, each led by a position colored
       dot, which is what the lineup looks like at a glance. Drawn as shapes so it
       renders the same everywhere. The PNG icons are rendered from this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#40C8E0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#40C8E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="104" y="128" width="304" height="256" rx="56" fill="url(#pane)" stroke="url(#rim)" stroke-width="4"/>
  <circle cx="162" cy="190" r="20" fill="#FF6482"/>
  <rect x="198" y="176" width="160" height="28" rx="14" fill="#FFFFFF"/>
  <circle cx="162" cy="256" r="20" fill="#63E6E2"/>
  <rect x="198" y="242" width="128" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="162" cy="322" r="20" fill="#FFD60A"/>
  <rect x="198" y="308" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
