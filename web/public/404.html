<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link id="icon" rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Not found · League Desk</title>
    <style>
      /* Standalone on purpose. GitHub Pages serves this page outside the app
         bundle, so it carries its own copy of the app's colors and glass. */
      :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --label: #000000;
        --label-2: rgba(60, 60, 67, 0.64);
        --tint: #007aff;
        --glow-1: rgba(88, 86, 214, 0.26);
        --glow-2: rgba(48, 176, 199, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --card: #1c1c1e;
          --label: #ffffff;
          --label-2: rgba(235, 235, 245, 0.62);
          --tint: #0a84ff;
          --glow-1: rgba(94, 92, 230, 0.3);
          --glow-2: rgba(64, 200, 224, 0.2);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        background:
          radial-gradient(60% 45% at 15% 0%, var(--glow-1), transparent 70%),
          radial-gradient(55% 40% at 90% 5%, var(--glow-2), transparent 70%),
          var(--bg);
        color: var(--label);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui,
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .code {
        font-family: ui-rounded, -apple-system, system-ui, sans-serif;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 16px 0 6px;
      }
      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.4;
        color: var(--label-2);
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 50px;
        margin-top: 28px;
        padding: 0 26px;
        border-radius: 999px;
        background: var(--tint);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 10px 24px -10px var(--tint);
      }
      a:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Nothing at this address</h1>
      <p>The dashboard itself is fine. It lives at one page, and this was not it.</p>
      <a id="home" href="/">Back to your leagues</a>
    </main>
    <script>
      // GitHub Pages serves this file at whatever URL was missing, so a relative
      // link would resolve against that bad path. A project site lives under its
      // repository name, which is always the first segment of the path.
      var parts = location.pathname.split('/').filter(Boolean)
      var base = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/'
      document.getElementById('home').href = base
      document.getElementById('icon').href = base + 'favicon.svg'
    </script>
  </body>
</html>
