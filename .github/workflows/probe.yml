# Temporary: runs this branch's tests and refresh on real data, without deploying.
# Removed before merging.
name: Probe (temporary)
on:
  push:
    branches: [claude/stoic-hypatia-3gr4gb]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh league data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: npm run refresh > refresh.log 2>&1 || (cat refresh.log && exit 1)
      - run: npm run build
      - run: grep -E -i "warn|unavailable|problem|error|playoff|Wrote" refresh.log | head -20; node probe.mjs
