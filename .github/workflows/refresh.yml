name: Refresh and deploy dashboard

on:
  schedule:
    # GitHub delays scheduled runs when Actions is busy, and drops some outright.
    # The busiest moments are the top and bottom of the hour, and on '0,30' this
    # repo got 5 to 7 of its 48 daily runs, hours apart. Asking four times an hour
    # on quiet minutes means more runs land, and a dropped one costs 15 minutes.
    # On game days the next job below takes over. For a guaranteed schedule the
    # rest of the week, see "Keeping the schedule on time" in the README.
    - cron: '8,23,38,53 * * * *'
  # Also the endpoint an external scheduler calls, as described in the README.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer run supersedes an older one that is still refreshing. This sits on
    # the jobs rather than the whole workflow so that the next job below can start
    # the following run without that run cancelling the one that started it.
    concurrency:
      group: refresh
      cancel-in-progress: true
    # A normal run takes under a minute. Without a limit, a hung request would hold
    # the concurrency group for GitHub's default of six hours.
    timeout-minutes: 10
    outputs:
      game_window: ${{ steps.refresh.outputs.game_window }}
      history_changed: ${{ steps.refresh.outputs.history_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Date stamp for the player cache key
        id: stamp
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Sleeper player cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ steps.stamp.outputs.day }}

      # The app's past waiver picks and how they did live on their own branch, so
      # main never gets data commits. The first run finds no branch and starts one.
      - name: Load pick history
        run: |
          mkdir -p .history
          if git fetch --depth=1 origin pick-history 2>/dev/null; then
            git show FETCH_HEAD:picks.json > .history/picks.json || rm -f .history/picks.json
          else
            echo "No pick history yet"
          fi

      - name: Refresh league data
        id: refresh
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Optional. Empty when the secret is not set, which turns notifications off.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run refresh

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Hand the pick history to the job that saves it
        if: steps.refresh.outputs.history_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pick-history
          path: .history/picks.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Commits the pick history to the pick-history branch, only when it changed,
  # which is about twice a week: when a week's picks lock at kickoff and when a
  # finished week is graded. This is the only job that can push, and it runs no
  # code from the refresh, just git plumbing on one JSON file.
  history:
    needs: build
    if: needs.build.outputs.history_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pick-history
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          name: pick-history
          path: .history
      - name: Commit to the pick-history branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          blob=$(git hash-object -w .history/picks.json)
          tree=$(printf '100644 blob %s\tpicks.json\n' "$blob" | git mktree)
          if git fetch --depth=1 origin pick-history 2>/dev/null; then
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              echo "Pick history unchanged"
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "Update pick history")
          else
            commit=$(git commit-tree "$tree" -m "Start pick history")
          fi
          git push origin "$commit:refs/heads/pick-history"

  # Game day mode. GitHub starts scheduled runs hours apart when Actions is busy,
  # which is fine on a Tuesday and useless on a Sunday. From three hours before a
  # kickoff until the game ends, each run waits eight minutes and starts the next
  # one itself, so scores and inactives land about every ten minutes. Outside that
  # window this job is skipped and the schedule above takes over again.
  #
  # Events caused by the workflow's own token normally start nothing, and
  # workflow_dispatch is one of the two exceptions GitHub makes. Public
  # repositories get Actions minutes for free, so the waiting costs nothing.
  next:
    needs: [build, deploy]
    if: needs.build.outputs.game_window == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Wait, then start the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 480
          # A scheduled run can land while this one waits. The newer run carries
          # on from here, so this one steps aside instead of doubling the pace.
          newer=$(gh run list --workflow refresh.yml --limit 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId > ${{ github.run_id }} and .status != "completed")] | length')
          if [ "$newer" -gt 0 ]; then
            echo "A newer refresh is already running and will start the next one."
            exit 0
          fi
          gh workflow run refresh.yml --ref main
