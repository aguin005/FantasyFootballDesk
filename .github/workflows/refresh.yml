name: Refresh and deploy dashboard

on:
  schedule:
    # GitHub delays scheduled runs when Actions is busy, and drops some outright.
    # The busiest moments are the top and bottom of the hour, and on '0,30' this
    # repo got 5 to 7 of its 48 daily runs, hours apart. Asking four times an hour
    # on quiet minutes means more runs land, and a dropped one costs 15 minutes.
    # For a guaranteed schedule, see "Keeping the schedule on time" in the README.
    - cron: '8,23,38,53 * * * *'
  # Also the endpoint an external scheduler calls, as described in the README.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes under a minute. Without a limit, a hung request would hold
    # the pages concurrency group for GitHub's default of six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Date stamp for the player cache key
        id: stamp
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Sleeper player cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sleeper-players-${{ steps.stamp.outputs.day }}

      - name: Refresh league data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Optional. Empty when the secret is not set, which turns notifications off.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run refresh

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
